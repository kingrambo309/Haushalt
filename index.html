<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<title>Haushalt</title>
<style>
:root{--bg:#f2f6fa;--sf:#fff;--tx:#162331;--mu:#64748b;--ac:#0e7c86;--ln:#e2e8f0;--wa:#d97706;--rd:#dc2626;--ok:#16a34a;--sd:0 1px 3px rgba(15,35,50,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:150px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;max-width:640px;margin:0 auto}
h1{font-size:24px;margin:0;flex:1}
#st{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:6px}
#st:before{content:"";width:9px;height:9px;border-radius:50%;background:#cbd5e1}
#st.ok:before{background:var(--ok)}#st.err:before{background:var(--rd)}
.ib{background:none;border:0;font-size:22px;padding:6px}
main{padding:0 16px;max-width:640px;margin:0 auto}
h2{font-size:17px;margin:24px 0 10px}
.mu{color:var(--mu)}
.hero{background:var(--ac);color:#fff;border-radius:20px;padding:20px}
.hero small{opacity:.85;font-size:14px}
.big{font-size:38px;font-weight:700;margin:2px 0}
.hs{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);font-size:14px}
.card{background:var(--sf);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--sd)}
.note{background:#fff7e6;border:1px solid #fde1a3}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:0;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--sd)}
.ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 16%,#fff)}
.m{flex:1;min-width:0}
.m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m small.w{color:var(--wa);font-weight:600}.m small.r{color:var(--rd);font-weight:600}
.pr{text-align:right;font-weight:700;white-space:nowrap}.pr small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sf);border:0;border-radius:16px;padding:14px;text-align:left;box-shadow:var(--sd);display:flex;flex-direction:column;gap:2px}
.tile .ic{margin-bottom:8px}.tile small{color:var(--mu)}
input[type=search],.f input,.f select,.f textarea,#so{width:100%;padding:13px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
#so{width:auto;padding:8px 10px;font-size:14px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:8px 14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:600}
.btn.s{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.btn.x{background:none;color:var(--rd)}
.btn.w{width:100%}
.add{width:100%;background:none;border:1.5px dashed var(--ln);border-radius:12px;padding:12px;color:var(--ac);font-weight:600;margin-bottom:6px}
#fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:32px;padding:0;box-shadow:0 6px 16px rgba(14,124,134,.4);z-index:3}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--ac);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(15,35,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 6px;font-size:20px}
.sh h4{margin:20px 0 8px;font-size:14px;color:var(--mu)}
.f{display:block;margin-bottom:12px}.f span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sf);border-radius:12px;margin-top:8px}
.doc a{flex:1;color:var(--ac);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;gap:10px;margin-top:18px}.bar .btn:first-child{flex:1}
.leg{display:flex;align-items:center;gap:10px;padding:7px 0}
.leg i{width:12px;height:12px;border-radius:4px;background:var(--c)}.leg b{margin-left:auto}
.bw{height:10px;background:var(--ln);border-radius:5px;margin-top:5px}.bw i{display:block;height:100%;border-radius:5px;background:var(--c,var(--ac))}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{background:var(--sf);border-radius:14px;padding:12px;box-shadow:var(--sd)}.facts b{display:block;font-size:20px}.facts small{color:var(--mu)}
.hide{display:none!important}
</style>
</head>
<body>
<header><h1>Haushalt</h1><span id="st">Offline</span><button class="ib" id="gear" title="Einstellungen">⚙️</button></header>
<main>
 <section id="v-home"></section>
 <section id="v-list" class="hide">
  <input type="search" id="q" placeholder="Einträge durchsuchen">
  <div id="chips"></div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:8px"><select id="so"><option value="n">Name A–Z</option><option value="t">Neueste zuerst</option><option value="d">Nächste Frist</option></select></div>
  <div id="list"></div>
 </section>
 <section id="v-docs" class="hide"><input type="search" id="qd" placeholder="Dokumente durchsuchen"><div id="dlist" style="margin-top:12px"></div></section>
 <section id="v-stats" class="hide"></section>
</main>
<button class="btn" id="fab" title="Neuer Eintrag">+</button>
<nav><button data-t="home" class="on"><span>🏠</span>Übersicht</button><button data-t="list"><span>📋</span>Einträge</button><button data-t="docs"><span>📎</span>Dokumente</button><button data-t="stats"><span>📊</span>Statistik</button></nav>

<div class="ov" id="ov"><div class="sh">
 <h3 id="sht">Eintrag</h3>
 <h4>Grunddaten</h4>
 <label class="f"><span>Kategorie</span><select id="fc"></select></label>
 <label class="f"><span>Titel</span><input id="ft" placeholder="z. B. Haftpflicht, VW Golf, Reisepass"></label>
 <div id="fx"></div>
 <h4>Kosten (optional)</h4>
 <button class="add" id="addc">+ Betrag hinzufügen</button>
 <div id="bc" class="two hide">
  <label class="f"><span>Betrag in €</span><input id="fk" type="number" inputmode="decimal" step="0.01" min="0"></label>
  <label class="f"><span>Zahlweise</span><select id="fi"><option>monatlich</option><option>vierteljährlich</option><option>halbjährlich</option><option>jährlich</option><option>einmalig</option></select></label>
  <button class="btn x" id="rmc" style="grid-column:1/3">Betrag entfernen</button>
 </div>
 <h4>Frist (optional)</h4>
 <button class="add" id="addd">+ Frist hinzufügen</button>
 <div id="bd" class="hide">
  <div class="two"><label class="f"><span>Bezeichnung</span><input id="fl"></label><label class="f"><span>Datum</span><input type="date" id="fd"></label></div>
  <button class="btn x" id="rmd" style="width:100%">Frist entfernen</button>
 </div>
 <h4>Notizen</h4>
 <label class="f"><textarea id="fn" rows="3" placeholder="Ansprechpartner, Hinweise …"></textarea></label>
 <h4>Dokumente</h4><div id="docs"></div>
 <input type="file" id="fu" multiple hidden>
 <button class="btn s w" id="fub" style="margin-top:10px">📎 Dokument hinzufügen</button>
 <label style="display:flex;gap:8px;align-items:center;margin-top:16px"><input type="checkbox" id="ff" style="width:20px;height:20px"> Als wichtig markieren ⭐</label>
 <div class="bar"><button class="btn" id="fs">Speichern</button><button class="btn s" id="fx2">Abbrechen</button><button class="btn x" id="fdel">Löschen</button></div>
</div></div>

<div class="ov" id="ov2"><div class="sh">
 <h3>Google Drive</h3>
 <p class="mu" style="margin-top:0">Daten und Dokumente liegen im Drive-Ordner „Haushalt“. Dafür brauchst du einmalig eine Client-ID aus der Google Cloud Console (Typ „Webanwendung“).</p>
 <label class="f"><span>Client-ID</span><input id="cid" placeholder="123456-abc.apps.googleusercontent.com" autocapitalize="off" autocorrect="off"></label>
 <label class="f"><span>Dieses Konto ist …</span><select id="role"><option value="owner">Hauptkonto (legt den Ordner „Haushalt“ an)</option><option value="partner">Partner (nutzt den freigegebenen Ordner)</option></select></label>
 <div id="shr" class="card hide"><b>Mit Partner teilen</b><label class="f" style="margin-top:8px"><input id="shm" type="email" placeholder="E-Mail-Adresse des Partners"></label><button class="btn s w" id="shb">Ordner freigeben</button></div>
 <div class="bar"><button class="btn" id="cidSave">Speichern und verbinden</button><button class="btn s" id="cidX">Schließen</button></div>
</div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $=s=>document.querySelector(s);
const T={
 Versicherung:{i:'🛡️',c:'#0e7c86',f:['Gesellschaft','Police-Nr.'],dl:'Kündigung bis'},
 Vertrag:{i:'📄',c:'#6366f1',f:['Anbieter','Kundennummer'],dl:'Kündigung bis'},
 Fahrzeug:{i:'🚗',c:'#f59e0b',f:['Kennzeichen','Modell','Fahrgestellnr.'],dl:'TÜV fällig'},
 Wohnen:{i:'🏠',c:'#ec4899',f:['Objekt / Adresse','Vermieter / Verwaltung'],dl:'Frist'},
 Steuer:{i:'🧾',c:'#16a34a',f:['Steuerjahr','Finanzamt'],dl:'Abgabe bis'},
 Gesundheit:{i:'🩺',c:'#e11d48',f:['Krankenkasse / Arzt','Versichertennr.'],dl:'Termin / Frist'},
 Ausweise:{i:'🪪',c:'#0284c7',f:['Dokumentnummer','Ausgestellt von'],dl:'Gültig bis'},
 Sonstiges:{i:'📁',c:'#94a3b8',f:[],dl:'Frist'}
};
const IV={'monatlich':1,'vierteljährlich':1/3,'halbjährlich':1/6,'jährlich':1/12,'einmalig':0};
const D='https://www.googleapis.com/drive/v3/files';
let data=JSON.parse(localStorage.getItem('hv_data')||'null')||{entries:[]};
let token=null,exp=0,folderId=null,fileId=null,tab='home',filter='Alle',q='',qd='',so='n',cur=null,isNew=false,timer=null,tc=null,res=null;
const cid=()=>localStorage.getItem('hv_cid')||'';
const role=()=>localStorage.getItem('hv_role')||'owner';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const fmt0=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fmtD=d=>d.split('-').reverse().join('.');
const dleft=d=>Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5);
const tp=e=>T[e.cat]||T.Sonstiges;
const mo1=e=>(+e.cost||0)*(IV[e.iv||'monatlich']||0);
const sum=L=>L.reduce((s,e)=>s+mo1(e),0);
const nDocs=L=>L.reduce((s,e)=>s+(e.docs||[]).length,0);
function setSt(t,c){const e=$('#st');e.textContent=t;e.className=c||'';}

/* ---- Google Drive ---- */
function initTc(){
 if(tc||!window.google||!google.accounts||!cid())return;
 tc=google.accounts.oauth2.initTokenClient({client_id:cid(),scope:'https://www.googleapis.com/auth/drive',
  callback:r=>{if(r.error){res&&res.rej(r.error);return;}token=r.access_token;exp=Date.now()+(r.expires_in-60)*1000;localStorage.setItem('hv_ok','1');res&&res.ok(token);},
  error_callback:e=>res&&res.rej(e.type||'error')});
}
function getToken(){
 if(token&&Date.now()<exp)return Promise.resolve(token);
 initTc();if(!tc)return Promise.reject('no client');
 return new Promise((ok,rej)=>{res={ok,rej};tc.requestAccessToken({prompt:localStorage.getItem('hv_ok')?'':'consent'});});
}
async function api(url,opt={}){
 const t=await getToken();
 const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
 if(!r.ok)throw new Error('Drive '+r.status);return r;
}
async function find(name,parent){
 const qq="name='"+name+"' and trashed=false"+(parent?" and '"+parent+"' in parents":" and mimeType='application/vnd.google-apps.folder'");
 const j=await(await api(D+'?q='+encodeURIComponent(qq)+'&fields=files(id)')).json();
 return j.files[0]&&j.files[0].id;
}
async function ensureFolder(){
 const owner=role()==='owner';
 const fq="name='Haushalt' and mimeType='application/vnd.google-apps.folder' and trashed=false"+(owner?" and 'me' in owners":" and sharedWithMe=true");
 const fl=await(await api(D+'?q='+encodeURIComponent(fq)+'&fields=files(id)')).json();
 folderId=fl.files[0]&&fl.files[0].id;
 if(!folderId&&!owner)throw new Error('NOFOLDER');
 if(!folderId){const r=await api(D,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Haushalt',mimeType:'application/vnd.google-apps.folder'})});folderId=(await r.json()).id;}
 fileId=await find('daten.json',folderId);
}
function up(name,blob,id){
 const meta=id?{name}:{name,parents:[folderId]};
 const f=new FormData();
 f.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
 f.append('file',blob);
 return api('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart&fields=id,name,mimeType',{method:id?'PATCH':'POST',body:f});
}
let who='';
function merge(a,b){
 const del=new Set([...(a.del||[]),...(b.del||[])]),m=new Map();
 [...(a.entries||[]),...(b.entries||[])].forEach(e=>{if(del.has(e.id))return;const o=m.get(e.id);if(!o||(e.upd||0)>(o.upd||0))m.set(e.id,e);});
 return {entries:[...m.values()],del:[...del]};
}
async function pullRemote(){
 if(!fileId)return;
 const r=await(await api(D+'/'+fileId+'?alt=media')).json();
 data=merge(r,data);localStorage.setItem('hv_data',JSON.stringify(data));render();
}
async function connect(){
 try{
  setSt('Verbinde …');await getToken();await ensureFolder();
  const u=(await(await api('https://www.googleapis.com/drive/v3/about?fields=user')).json()).user;
  who=(u.displayName||u.emailAddress||'').split(' ')[0];
  await save();setSt('Verbunden: '+who,'ok');render();
 }catch(e){
  if(e.message==='NOFOLDER'){setSt('Ordner nicht freigegeben','err');alert('Der Ordner „Haushalt“ ist für dieses Konto noch nicht freigegeben. Bitte das Hauptkonto, ihn in den Einstellungen über „Ordner freigeben“ zu teilen.');}
  else setSt('Nicht verbunden','err');
  render();
 }
}
async function save(){
 if(!folderId){setSt('Nur lokal gespeichert','err');return;}
 try{
  await pullRemote();
  const r=await up('daten.json',new Blob([JSON.stringify(data)],{type:'application/json'}),fileId);fileId=(await r.json()).id;
  setSt('Gespeichert · '+who,'ok');
 }catch(e){setSt('Speichern fehlgeschlagen','err');}
}
function dirty(){
 localStorage.setItem('hv_data',JSON.stringify(data));render();
 clearTimeout(timer);setSt('Speichere …');timer=setTimeout(save,800);
}

/* ---- Ansichten ---- */
function rowHtml(e){
 const t=tp(e),k=(e.docs||[]).length,x=e.x||{},first=t.f.map(l=>x[l]).find(Boolean);
 let fr='';
 if(e.due){const n=dleft(e.due),lb=e.dl||t.dl;fr='<small class="'+(n<0?'r':n<=30?'w':'')+'">'+esc(lb)+': '+fmtD(e.due)+' · '+(n<0?'abgelaufen':n===0?'heute':'in '+n+(n===1?' Tag':' Tagen'))+'</small>';}
 const pr=e.cost?(e.iv==='einmalig'?fmt(+e.cost)+'<small>einmalig</small>':fmt(mo1(e))+'<small>pro Monat</small>'):'';
 return '<button class="row" data-id="'+e.id+'" style="--c:'+t.c+'"><span class="ic">'+t.i+'</span><div class="m"><b>'+(e.fav?'⭐ ':'')+esc(e.title)+'</b><small>'+e.cat+(first?' · '+esc(first):'')+(k?' · '+k+' 📎':'')+'</small>'+fr+'</div><div class="pr">'+pr+'</div></button>';
}
function renderHome(){
 const E=data.entries,mo=sum(E),dl=E.filter(e=>e.due).map(e=>({e,n:dleft(e.due)})).sort((a,b)=>a.n-b.n);
 const dc=nDocs(E),soon=dl.filter(x=>x.n<=30).length,fav=E.filter(e=>e.fav);
 let h='';
 if(!cid())h+='<div class="card note"><b>Noch nicht eingerichtet</b><p style="margin:6px 0 12px">Verbinde Google Drive, damit deine Daten und Dokumente gespeichert werden.</p><button class="btn w" data-set="1">Einrichten</button></div>';
 else if(!folderId)h+='<div class="card note"><b>Nicht mit Drive verbunden</b><p style="margin:6px 0 12px">Einträge sind nur auf diesem Gerät. Verbinde dich, um zu speichern und Dokumente zu nutzen.</p><button class="btn w" data-con="1">Mit Google Drive verbinden</button></div>';
 if(!E.length){
  h+='<div class="card"><b>Los geht’s</b><p class="mu" style="margin:6px 0 12px">Womit möchtest du anfangen? Jeder Eintrag kann Dokumente enthalten. Beträge und Fristen sind optional.</p><div class="grid">'+Object.keys(T).map(c=>'<button class="tile" data-new="'+c+'" style="--c:'+T[c].c+'"><span class="ic">'+T[c].i+'</span><b>'+c+'</b></button>').join('')+'</div></div>';
  $('#v-home').innerHTML=h;return;
 }
 h+='<div class="hero">'+(mo>0?'<small>Fixkosten pro Monat</small><div class="big">'+fmt(mo)+'</div><div>'+fmt(mo*12)+' pro Jahr</div>':'<small>Gespeichert</small><div class="big">'+dc+' Dokument'+(dc===1?'':'e')+'</div><div>in '+E.length+(E.length===1?' Eintrag':' Einträgen')+'</div>')+
  '<div class="hs">'+(mo>0?'<span><b>'+E.length+'</b> Einträge</span><span><b>'+dc+'</b> Dokumente</span>':'')+(dl.length?'<span><b>'+soon+'</b> Fristen in 30 Tagen</span>':'')+'</div></div>';
 if(fav.length)h+='<h2>Wichtig</h2>'+fav.slice(0,5).map(rowHtml).join('');
 if(dl.length)h+='<h2>Anstehende Fristen</h2>'+dl.slice(0,5).map(x=>rowHtml(x.e)).join('');
 h+='<h2>Zuletzt hinzugefügt</h2>'+E.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,4).map(rowHtml).join('');
 h+='<h2>Kategorien</h2><div class="grid">'+Object.keys(T).map(c=>{const L=E.filter(e=>e.cat===c),s=sum(L),d=nDocs(L);return '<button class="tile" data-go="'+c+'" style="--c:'+T[c].c+'"><span class="ic">'+T[c].i+'</span><b>'+c+'</b><small>'+L.length+(L.length===1?' Eintrag':' Einträge')+(d?' · '+d+' Dok.':'')+(s?'<br>'+fmt0(s)+' pro Monat':'')+'</small></button>';}).join('')+'</div>';
 $('#v-home').innerHTML=h;
}
function renderList(){
 $('#chips').innerHTML=['Alle',...Object.keys(T)].map(c=>'<button class="chip'+(c===filter?' on':'')+'" data-c="'+c+'">'+c+'</button>').join('');
 const hay=e=>(e.title+' '+(e.note||'')+' '+Object.values(e.x||{}).join(' ')).toLowerCase();
 const l=data.entries.filter(e=>(filter==='Alle'||e.cat===filter)&&hay(e).includes(q));
 l.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(so==='t'?(b.ts||0)-(a.ts||0):so==='d'?(a.due||'9')<(b.due||'9')?-1:(a.due||'9')>(b.due||'9')?1:0:a.title.localeCompare(b.title,'de')));
 $('#list').innerHTML=l.map(rowHtml).join('')||'<p class="mu" style="margin-top:20px">Keine Einträge gefunden. Tippe unten rechts auf +, um einen anzulegen.</p>';
}
function renderDocs2(){
 const L=[];data.entries.forEach(e=>(e.docs||[]).forEach(d=>L.push({d,e})));
 const f=L.filter(x=>(x.d.name+' '+x.e.title).toLowerCase().includes(qd));
 $('#dlist').innerHTML=f.map(x=>{const n=x.d.name.toLowerCase(),ic=n.endsWith('.pdf')?'📕':/\.(jpe?g|png|heic|webp)$/.test(n)?'🖼️':'📄';
  return '<button class="row" data-od="'+x.d.id+'" data-oe="'+x.e.id+'" style="--c:'+tp(x.e).c+'"><span class="ic">'+ic+'</span><div class="m"><b>'+esc(x.d.name)+'</b><small>'+tp(x.e).i+' '+esc(x.e.title)+'</small></div></button>';}).join('')||'<p class="mu">'+(L.length?'Keine Treffer.':'Noch keine Dokumente. Hänge sie in einem Eintrag über „Dokument hinzufügen“ an.')+'</p>';
}
function renderStats(){
 const E=data.entries;
 if(!E.length){$('#v-stats').innerHTML='<div class="card"><b>Noch keine Daten</b><p class="mu" style="margin:6px 0 0">Sobald du Einträge angelegt hast, siehst du hier Auswertungen.</p></div>';return;}
 const mo=sum(E),priced=E.filter(e=>mo1(e)>0),dd=E.filter(e=>e.due);
 const cats=Object.keys(T).map(c=>({c,n:E.filter(e=>e.cat===c).length,d:nDocs(E.filter(e=>e.cat===c))})).filter(x=>x.n),mx=Math.max(...cats.map(x=>x.n));
 let h='<h2 style="margin-top:8px">Überblick</h2><div class="facts"><div><b>'+E.length+'</b><small>Einträge</small></div><div><b>'+nDocs(E)+'</b><small>Dokumente</small></div></div>'+
 '<h2>Einträge pro Kategorie</h2><div class="card">'+cats.map(x=>'<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>'+T[x.c].i+' '+x.c+'</span><b>'+x.n+'</b></div><div class="bw" style="--c:'+T[x.c].c+'"><i style="width:'+(x.n/mx*100)+'%"></i></div></div>').join('')+'</div>';
 if(priced.length){
  const by=Object.keys(T).map(c=>({c,v:sum(E.filter(e=>e.cat===c))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  let off=25;
  const segs=by.map(x=>{const p=x.v/mo*100,s='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+T[x.c].c+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p;return s;}).join('');
  const top=priced.slice().sort((a,b)=>mo1(b)-mo1(a)).slice(0,5),m1=mo1(top[0]),once=E.filter(e=>e.iv==='einmalig').reduce((s,e)=>s+(+e.cost||0),0);
  h+='<h2>Kosten nach Kategorie</h2><div class="card"><svg viewBox="0 0 42 42" style="width:210px;display:block;margin:0 auto"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#e2e8f0" stroke-width="6"/>'+segs+'<text x="21" y="20.5" text-anchor="middle" font-size="4.6" font-weight="700" fill="#162331">'+fmt0(mo)+'</text><text x="21" y="25.5" text-anchor="middle" font-size="2.6" fill="#64748b">pro Monat</text></svg><div style="margin-top:10px">'+
  by.map(x=>'<div class="leg" style="--c:'+T[x.c].c+'"><i></i>'+x.c+' <span class="mu">'+Math.round(x.v/mo*100)+' %</span><b>'+fmt(x.v)+'</b></div>').join('')+'</div></div>'+
  '<h2>Teuerste Posten pro Monat</h2><div class="card">'+top.map(e=>'<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px"><span>'+esc(e.title)+'</span><b>'+fmt(mo1(e))+'</b></div><div class="bw" style="--c:'+tp(e).c+'"><i style="width:'+(mo1(e)/m1*100)+'%"></i></div></div>').join('')+'</div>'+
  '<div class="facts"><div><b>'+fmt0(mo*12)+'</b><small>Kosten pro Jahr</small></div><div><b>'+fmt0(once)+'</b><small>Einmalige Kosten</small></div><div><b>'+priced.length+' von '+E.length+'</b><small>Einträge mit Betrag</small></div><div><b>'+fmt0(mo/priced.length)+'</b><small>Ø pro Posten und Monat</small></div></div>';
 }
 if(dd.length){
  const od=dd.filter(e=>dleft(e.due)<0).length,s30=dd.filter(e=>dleft(e.due)>=0&&dleft(e.due)<=30).length;
  h+='<h2>Fristen im Überblick</h2><div class="facts"><div><b style="color:var(--rd)">'+od+'</b><small>abgelaufen</small></div><div><b style="color:var(--wa)">'+s30+'</b><small>in den nächsten 30 Tagen</small></div><div><b>'+(dd.length-od-s30)+'</b><small>später</small></div><div><b>'+(E.length-dd.length)+'</b><small>ohne Frist</small></div></div>';
 }
 $('#v-stats').innerHTML=h;
}
function render(){
 ['home','list','docs','stats'].forEach(t=>$('#v-'+t).classList.toggle('hide',t!==tab));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 ({home:renderHome,list:renderList,docs:renderDocs2,stats:renderStats})[tab]();
}

/* ---- Eintrag bearbeiten ---- */
function fieldsHtml(){return T[cur.cat].f.map(l=>'<label class="f"><span>'+l+'</span><input data-x="'+esc(l)+'" value="'+esc(cur.x[l]||'')+'"></label>').join('');}
function readX(){document.querySelectorAll('#fx input').forEach(i=>cur.x[i.dataset.x]=i.value);}
function sync(){
 $('#bc').classList.toggle('hide',!cur._c);$('#addc').classList.toggle('hide',!!cur._c);
 $('#bd').classList.toggle('hide',!cur._d);$('#addd').classList.toggle('hide',!!cur._d);
 $('#fl').placeholder=T[cur.cat].dl;
}
function openSheet(e,nw){
 cur=JSON.parse(JSON.stringify(e));cur.docs=cur.docs||[];cur.x=cur.x||{};isNew=nw;
 cur._c=!!cur.cost;cur._d=!!cur.due;
 $('#sht').textContent=nw?'Neuer Eintrag':'Eintrag bearbeiten';
 $('#fc').innerHTML=Object.keys(T).map(c=>'<option'+(c===cur.cat?' selected':'')+'>'+c+'</option>').join('');
 $('#ft').value=cur.title||'';$('#fx').innerHTML=fieldsHtml();
 $('#fk').value=cur.cost||'';$('#fi').value=cur.iv||'monatlich';$('#fd').value=cur.due||'';$('#fl').value=cur.dl||'';
 $('#fn').value=cur.note||'';$('#ff').checked=!!cur.fav;
 $('#fdel').classList.toggle('hide',nw);sync();renderDocs();$('#ov').classList.add('on');
}
function renderDocs(){
 $('#docs').innerHTML=cur.docs.map((d,i)=>'<div class="doc">📎<a data-o="'+i+'">'+esc(d.name)+'</a><button class="ib" data-r="'+i+'" title="Entfernen">✕</button></div>').join('')||'<p class="mu" style="margin:6px 0 0">Noch keine Dokumente.</p>';
}
function closeSheet(){$('#ov').classList.remove('on');cur=null;}
async function delDrive(id){try{await api(D+'/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});}catch(e){}}
async function openDoc(d){
 try{setSt('Lade Dokument …');const b=await(await api(D+'/'+d.id+'?alt=media')).blob();
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.target='_blank';a.download=d.name;document.body.appendChild(a);a.click();a.remove();setSt('Verbunden','ok');}
 catch(e){setSt('Dokument nicht ladbar','err');}
}
function newEntry(cat){openSheet({id:'e'+Date.now(),ts:Date.now(),cat:cat,title:'',x:{},note:'',cost:'',iv:'monatlich',due:'',dl:'',docs:[]},true);}

/* ---- Ereignisse ---- */
const open=id=>openSheet(data.entries.find(x=>x.id===id),false);
$('nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();scrollTo(0,0);}};
$('#v-home').onclick=e=>{
 const r=e.target.closest('[data-id]'),g=e.target.closest('[data-go]'),n=e.target.closest('[data-new]');
 if(r)open(r.dataset.id);
 else if(n)newEntry(n.dataset.new);
 else if(g){filter=g.dataset.go;tab='list';render();scrollTo(0,0);}
 else if(e.target.dataset.set)openSettings();
 else if(e.target.dataset.con)connect();
};
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){filter=c;renderList();}};
$('#q').oninput=e=>{q=e.target.value.toLowerCase();renderList();};
$('#qd').oninput=e=>{qd=e.target.value.toLowerCase();renderDocs2();};
$('#so').onchange=e=>{so=e.target.value;renderList();};
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)open(r.dataset.id);};
$('#dlist').onclick=e=>{
 const r=e.target.closest('.row');if(!r)return;
 const en=data.entries.find(x=>x.id===r.dataset.oe);openDoc(en.docs.find(d=>d.id===r.dataset.od));
};
$('#fab').onclick=()=>newEntry(filter in T?filter:'Versicherung');
$('#fc').onchange=()=>{readX();cur.cat=$('#fc').value;$('#fx').innerHTML=fieldsHtml();sync();};
$('#addc').onclick=()=>{cur._c=true;sync();$('#fk').focus();};
$('#addd').onclick=()=>{cur._d=true;sync();};
$('#rmc').onclick=()=>{cur._c=false;$('#fk').value='';sync();};
$('#rmd').onclick=()=>{cur._d=false;$('#fd').value='';$('#fl').value='';sync();};
$('#fub').onclick=()=>$('#fu').click();
$('#fu').onchange=async e=>{
 if(!folderId){alert('Bitte zuerst mit Google Drive verbinden (Übersicht, oben).');e.target.value='';return;}
 for(const f of e.target.files){try{setSt('Lade hoch: '+f.name);const j=await(await up(f.name,f)).json();cur.docs.push({id:j.id,name:j.name});renderDocs();setSt('Hochgeladen','ok');}catch(x){setSt('Upload fehlgeschlagen','err');}}
 e.target.value='';
};
$('#docs').onclick=async e=>{
 if(e.target.dataset.o!==undefined)openDoc(cur.docs[e.target.dataset.o]);
 if(e.target.dataset.r!==undefined){const i=+e.target.dataset.r;if(confirm('Dokument auch aus Drive löschen?')){await delDrive(cur.docs[i].id);cur.docs.splice(i,1);renderDocs();}}
};
$('#fs').onclick=()=>{
 if(!$('#ft').value.trim()){$('#ft').focus();return;}
 readX();cur.cat=$('#fc').value;cur.title=$('#ft').value.trim();
 cur.cost=cur._c?$('#fk').value:'';cur.iv=$('#fi').value;
 cur.due=cur._d?$('#fd').value:'';cur.dl=cur._d?$('#fl').value.trim():'';
 cur.note=$('#fn').value;cur.fav=$('#ff').checked;
 delete cur._c;delete cur._d;cur.upd=Date.now();
 if(isNew)data.entries.push(cur);else data.entries[data.entries.findIndex(x=>x.id===cur.id)]=cur;
 dirty();closeSheet();
};
$('#fx2').onclick=()=>{if(isNew)cur.docs.forEach(d=>delDrive(d.id));closeSheet();};
$('#fdel').onclick=()=>{
 if(!confirm('Eintrag und alle zugehörigen Dokumente löschen?'))return;
 cur.docs.forEach(d=>delDrive(d.id));data.del=(data.del||[]).concat(cur.id);data.entries=data.entries.filter(x=>x.id!==cur.id);dirty();closeSheet();
};
function openSettings(){$('#cid').value=cid();$('#role').value=role();$('#shr').classList.toggle('hide',!(role()==='owner'&&folderId));$('#ov2').classList.add('on');}
$('#gear').onclick=openSettings;
$('#cidX').onclick=()=>$('#ov2').classList.remove('on');
$('#cidSave').onclick=()=>{
 localStorage.setItem('hv_cid',$('#cid').value.trim());localStorage.setItem('hv_role',$('#role').value);localStorage.removeItem('hv_ok');tc=null;token=null;folderId=null;fileId=null;
 $('#ov2').classList.remove('on');connect();
};
$('#shb').onclick=async()=>{
 const m=$('#shm').value.trim();if(!m||!folderId)return;
 try{await api(D+'/'+folderId+'/permissions?sendNotificationEmail=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'user',role:'writer',emailAddress:m})});alert('Ordner freigegeben für '+m);$('#shm').value='';}
 catch(e){alert('Freigabe fehlgeschlagen. Bitte die E-Mail-Adresse prüfen.');}
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&folderId&&token&&Date.now()<exp)pullRemote().catch(()=>{});});
render();
if(!cid())openSettings();
</script>
</body>
</html>
